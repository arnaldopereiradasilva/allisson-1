<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo — Allysson Joias</title>
  <link rel="stylesheet" href="admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="admin-header">
    <h1>✦ Painel Allysson Joias</h1>
    <div class="admin-header-actions">
      <a href="index.html" target="_blank" class="btn-outline-sm">Ver site</a>
      <button class="btn-sm btn-danger" id="btnLogout">Sair</button>
    </div>
  </header>

  <div class="admin-login" id="telaLogin">
    <div class="login-card">
      <h2>Acesso restrito</h2>
      <p>Digite a senha para gerenciar as joias</p>
      <input type="password" id="inputSenha" placeholder="Senha" />
      <button id="btnEntrar">Entrar</button>
      <span class="login-erro" id="loginErro"></span>
    </div>
  </div>

  <main class="admin-main" id="telaAdmin" style="display:none">
    <div class="admin-aviso">Painel disponível apenas no computador local. No site público as alterações não persistem.</div>
    <div class="admin-bar">
      <div class="admin-tabs" id="tabsCategorias"></div>
      <button class="btn-add" id="btnAddProduto">+ Novo produto</button>
    </div>

    <div class="admin-content" id="gradeProdutos"></div>
  </main>

  <div class="modal-overlay" id="modalOverlay" style="display:none">
    <div class="modal">
      <button class="modal-fechar" id="modalFechar">&times;</button>
      <h3 id="modalTitulo">Novo produto</h3>
      <form id="formProduto" autocomplete="off">
        <input type="hidden" id="editId" />
        <input type="hidden" id="editCategoria" />

        <label>Nome do produto</label>
        <input type="text" id="inputNome" placeholder="Ex: Com diamante" required />

        <label>Texto alternativo (alt)</label>
        <input type="text" id="inputAlt" placeholder="Ex: Aliança ouro 18k com diamante" />

        <label>Imagem</label>
        <div class="upload-area" id="uploadArea">
          <span class="upload-placeholder" id="uploadPlaceholder">Clique para selecionar imagem</span>
          <img id="uploadPreview" class="upload-preview" style="display:none" />
          <input type="file" id="inputImagem" accept="image/jpeg,image/png,image/webp" />
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="modalCancelar">Cancelar</button>
          <button type="submit" class="btn-save" id="modalSalvar">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
